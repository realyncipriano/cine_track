<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Movie tracking and review app.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CineTrack">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CineTrack</title>
  <link rel="manifest" href="manifest.json">

  <style>
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0D1117;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    #loading.hide {
      opacity: 0;
      pointer-events: none;
    }
    #loading img {
      width: 72px;
      height: 72px;
      margin-bottom: 16px;
    }
    #loading h1 {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: #865DFF;
      letter-spacing: 0.5px;
    }
    #loading .spinner {
      margin-top: 32px;
      width: 28px;
      height: 28px;
      border: 3px solid rgba(134, 93, 255, 0.15);
      border-top-color: #865DFF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) el.classList.add('hide');
    });
  </script>
</head>
<body>
  <div id="loading">
    <img src="icons/Icon-512.png" alt="CineTrack">
    <h1>CineTrack</h1>
    <div class="spinner"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
